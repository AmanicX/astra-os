# AstraOS live initramfs hooks.  The installer boots from local ISO media, so
# the PXE and memdisk hooks from the releng profile are omitted; they need
# nbd-client, mkinitcpio-nfs-utils and memdiskfind, which are not installed.
HOOKS=(base udev plymouth microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
