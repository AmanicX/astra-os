# Single source of truth for AstraOS user-facing identity.
#
# Build scripts read these values. Change the product name here, not in boot
# entries, installer headers, documentation or generated artwork.
#
# `iso_label_prefix` is the one deliberately uppercase technical value: it is
# used in the ISO9660 volume label and must match archisolabel=.

name = "AstraOS"
long_name = "Astra Linux"
id = "astraos"
iso_label_prefix = "ASTRA"
website = "https://astraos.org"
tagline = "A calm, design-driven Linux system"
