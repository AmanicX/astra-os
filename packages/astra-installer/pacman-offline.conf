# Pacman configuration used by pacstrap in the offline ISO installer.
# Only the local AstraOS repository and the signed Arch Linux Archive snapshot
# are reachable; the target receives the real pacman.conf afterwards.

[options]
Architecture = auto
HoldPkg = pacman glibc
ParallelDownloads = 5
SigLevel = Optional TrustAll
LocalFileSigLevel = Optional
Color
CheckSpace

[astra-local]
SigLevel = Optional TrustAll
Server = file:///run/astra-install/repo/$arch
