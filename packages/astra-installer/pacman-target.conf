# Pacman configuration written to the installed system after pacstrap.
# The mirrorlist is selected in installer step 2; multilib is enabled for Steam.

[options]
Architecture = auto
HoldPkg = pacman glibc
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
Color
CheckSpace

# The installer inserts the chosen Arch Linux Archive mirrorlist here at install
# time (mirrors are selected in step 2 of the TUI). multilib stays enabled.

[multilib]
Include = /etc/pacman.d/mirrorlist
