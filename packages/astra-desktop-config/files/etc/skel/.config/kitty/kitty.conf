# Keep Noctalia's generated colors. Do not replace themes/noctalia.conf.
include themes/noctalia.conf

# Typography: install ttf-jetbrains-mono-nerd on Arch.
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5

# Steady white cursor: no blinking or opacity-pulse animation.
cursor_shape block
cursor_shape_unfocused unchanged
cursor_blink_interval 0
shell_integration no-cursor
cursor #ffffff

# Smooth, longer cursor trail. Higher decay values keep the trail visible
# longer, so short cursor moves glide instead of snapping.
# Use cursor_trail 0 if you want no trail at all.
cursor_trail 1
cursor_trail_decay 0.2 0.6
cursor_trail_start_threshold 1

# Spacing and appearance; Niri supplies exterior corners and shadows.
window_padding_width 12
window_margin_width 0
hide_window_decorations yes
background_opacity 0.88
inactive_text_alpha 1.0
dim_opacity 1.0

# A compact tab bar, visible only when there is more than one tab.
tab_bar_min_tabs 2
tab_bar_edge bottom
tab_bar_style separator
tab_separator "  |  "
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

# Quiet terminal with useful history; keep Kitty's default shortcuts.
enable_audio_bell no
visual_bell_duration 0
scrollback_lines 10000
detect_urls yes
copy_on_select no

# Additional font configuration for Oh My Posh (preserves theme)
include posh-font.conf
