# AstraOS btop defaults. The Noctalia theme is regenerated by Noctalia when
# the desktop palette changes.
color_theme = "noctalia"
theme_background = true
truecolor = true
update_ms = 2000
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = true
cpu_single_graph = false
show_uptime = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
temp_scale = "celsius"
show_cpu_freq = true
show_gpu_info = "Auto"
show_battery = true
show_disks = true
only_physical = true
use_fstab = true
show_io_stat = true
io_mode = "Auto"
net_auto = true
net_sync = false
show_net_compacted = false
show_net_graph = true
mem_graphs = true
show_swap = true
swap_free = true
show_cores = true
shown_boxes = "cpu mem net proc"
