[package]
name = "astra-installer"
version = "0.2.0"
edition = "2021"
description = "AstraOS Tauri installer"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
